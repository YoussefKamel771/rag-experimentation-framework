input_dir: data/raw/text_data_toc.csv
output_dir: artifacts

chunking:
  strategy: recursive
  params:
    chunk_size: 1000
    chunk_overlap: 150

embedding:
  provider: sentence_transformers
  params:
    model: intfloat/e5-base-v2
    batch_size: 32
    device: cpu

vector_store:
  type: qdrant
  params:
    path: artifacts/qdrant
    collection_name: rag_chunks
    distance: cosine

retrieval:

  type: hybrid
  top_k: 5    

  params:
    alpha: 0.7
    candidate_k: 20

  dense:
    source:
      type: qdrant

  lexical:
    type: bm25

    params:
      chunks_path: artifacts/qdrant/chunks.json
      k1: 1.5
      b: 0.75