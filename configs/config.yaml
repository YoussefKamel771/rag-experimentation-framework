input_dir: data/raw/text_data_toc.csv
output_dir: artifacts

chunking:
  strategy: recursive
  params:
    chunk_size: 1000
    chunk_overlap: 150

embedding:
  provider: sentence_transformers
  params:
    model: intfloat/e5-base-v2
    batch_size: 32
    device: cpu

vector_store:
  type: qdrant
  params:
    path: artifacts/qdrant
    collection_name: rag_chunks
    distance: cosine

retrieval:

  type: hybrid
  candidate_k: 20 

  params:
    alpha: 0.7
    candidate_k: 20

  dense:
    source:
      type: qdrant

  lexical:
    type: bm25

    params:
      chunks_path: artifacts/qdrant/chunks.json
      k1: 1.5
      b: 0.75

reranker:
  type: cross_encoder

  top_k: 5

  params:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    batch_size: 16
    device: cpu

context:
  type: simple

  params:
    max_characters: 12000
    separator: \n\n---\n\n
    include_metadata: False

generation:
  provider: ollama

  params:
    model: qwen3:4b
    base_url: https://condone-hankering-cushy.ngrok-free.dev
    temperature: 0.0
    timeout: 120.0
