[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-experimentation-framework"
version = "0.1.0"
description = "Modular framework for experimenting with RAG pipelines"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
]

[project.scripts]
rag-ingest = "src.pipeline.indexer:main"

[tool.setuptools.packages.find]
include = ["src*"]
